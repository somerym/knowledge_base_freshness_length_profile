[build-system]
requires = ["setuptools>=61"]
build-backend = "setuptools.build_meta"

[project]
name = "somerym-knowledge_base_freshness_length_profile"
version = "0.1.0"
description = "按段落统计实时数仓架构师·知识库的时效性维护相关的长度分布，标出过长、过短与重复表达的部分"
readme = "README.md"
requires-python = ">=3.10"
license = { file = "LICENSE" }
authors = [{ name = "somerym" }]
keywords = ["cli", "analysis", "observability", "evaluation"]
classifiers = [
    "Development Status :: 4 - Beta",
    "Environment :: Console",
    "License :: OSI Approved :: MIT License",
    "Programming Language :: Python :: 3",
    "Programming Language :: Python :: 3 :: Only",
    "Topic :: Utilities",
]

[project.urls]
Homepage = "https://somerym.github.io"
Repository = "https://github.com/somerym/knowledge_base_freshness_length_profile"
Issues = "https://github.com/somerym/knowledge_base_freshness_length_profile/issues"

[project.scripts]
knowledge_base_freshness_length_profile = "knowledge_base_freshness_length_profile:main"

[tool.setuptools]
py-modules = ["knowledge_base_freshness_length_profile"]
